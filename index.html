<script>
/* =========================================================
   SCAMLENS — PROFESSIONAL ANALYSIS ENGINE
   Pattern-based detection only.
   No single keyword should determine a scam verdict.
========================================================= */

"use strict";

/* =========================================================
   CONFIGURATION
========================================================= */

const ScamLens = (() => {

  /* -------------------------------------------------------
     Known brands and their legitimate domains.
     This is intentionally explicit rather than guessing.
  ------------------------------------------------------- */

  const OFFICIAL_DOMAINS = {
    google: ["google.com"],
    microsoft: ["microsoft.com"],
    apple: ["apple.com"],
    amazon: ["amazon.com"],
    paypal: ["paypal.com"],
    netflix: ["netflix.com"],
    facebook: ["facebook.com", "fb.com"],
    instagram: ["instagram.com"],
    whatsapp: ["whatsapp.com"],
    linkedin: ["linkedin.com"],
    twitter: ["twitter.com", "x.com"],
    x: ["x.com", "twitter.com"],
    youtube: ["youtube.com"],
    ebay: ["ebay.com"],
    github: ["github.com"],
    dropbox: ["dropbox.com"],
    dhl: ["dhl.com"],
    fedex: ["fedex.com"],
    ups: ["ups.com"],
    stripe: ["stripe.com"],
    paypal: ["paypal.com"],
    comcast: ["comcast.com"],
    netflix: ["netflix.com"],
    spotify: ["spotify.com"],
    adobe: ["adobe.com"],
    zoom: ["zoom.us"],
    openai: ["openai.com"],
    chatgpt: ["openai.com"]
  };

  const FREE_EMAIL_DOMAINS = new Set([
    "gmail.com",
    "googlemail.com",
    "yahoo.com",
    "yahoo.co.uk",
    "hotmail.com",
    "outlook.com",
    "live.com",
    "msn.com",
    "icloud.com",
    "me.com",
    "aol.com",
    "proton.me",
    "protonmail.com",
    "gmx.com"
  ]);

  const SUSPICIOUS_TLDS = new Set([
    "tk",
    "ml",
    "ga",
    "cf",
    "gq"
  ]);

  const COMMON_BRANDS = Object.keys(OFFICIAL_DOMAINS);

  /* -------------------------------------------------------
     Helper functions
  ------------------------------------------------------- */

  function normalize(text) {
    return String(text || "")
      .toLowerCase()
      .replace(/\s+/g, " ")
      .trim();
  }

  function escapeRegex(value) {
    return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function containsPhrase(text, phrases) {
    const lower = normalize(text);

    return phrases.find(phrase => {
      const p = normalize(phrase);

      if (p.includes(" ")) {
        return lower.includes(p);
      }

      return new RegExp(
        "\\b" + escapeRegex(p) + "\\b",
        "i"
      ).test(lower);
    });
  }

  function unique(array) {
    return [...new Set(array)];
  }

  function severityWeight(severity) {
    return {
      High: 30,
      Medium: 15,
      Low: 5
    }[severity] || 0;
  }

  function createFlag(
    name,
    severity,
    description,
    evidence,
    confidence = "moderate"
  ) {
    return {
      name,
      severity,
      description,
      evidence: evidence || "",
      confidence
    };
  }

  function hasAny(text, words) {
    return Boolean(containsPhrase(text, words));
  }

  function getMatches(text, words) {
    const lower = normalize(text);

    return unique(
      words.filter(word =>
        lower.includes(normalize(word))
      )
    );
  }

  /* =======================================================
     URL HELPERS
  ======================================================= */

  function extractURL(text) {
    const match = String(text || "").match(
      /\b(?:https?:\/\/)?(?:www\.)?[a-z0-9.-]+\.[a-z]{2,}(?:\/[^\s]*)?/i
    );

    return match ? match[0] : null;
  }

  function parseURL(text) {
    const raw = extractURL(text);

    if (!raw) return null;

    let value = raw.trim();

    if (!/^https?:\/\//i.test(value)) {
      value = "https://" + value;
    }

    try {
      return new URL(value);
    } catch {
      return null;
    }
  }

  function isIPv4(host) {
    if (!/^\d{1,3}(?:\.\d{1,3}){3}$/.test(host)) {
      return false;
    }

    return host
      .split(".")
      .every(part => Number(part) >= 0 && Number(part) <= 255);
  }

  function getRootDomain(host) {
    const parts = host.split(".");

    if (parts.length < 2) {
      return host;
    }

    return parts.slice(-2).join(".");
  }

  function getTLD(host) {
    const parts = host.split(".");
    return parts.length ? parts[parts.length - 1] : "";
  }

  function looksLikeBrand(host, brand) {
    const cleanHost = host
      .replace(/^www\./, "")
      .toLowerCase();

    const officialDomains =
      OFFICIAL_DOMAINS[brand] || [];

    /* Legitimate domain */
    if (
      officialDomains.some(domain =>
        cleanHost === domain ||
        cleanHost.endsWith("." + domain)
      )
    ) {
      return false;
    }

    const compact = cleanHost.replace(/[^a-z0-9]/g, "");

    const brandCompact =
      brand.toLowerCase().replace(/[^a-z0-9]/g, "");

    /*
      Only flag reasonably strong lookalikes.
      This prevents words such as "amazon-support-example.com"
      from automatically becoming a false positive merely because
      they contain the word amazon.
    */

    if (
      compact.includes(brandCompact) &&
      compact !== brandCompact
    ) {
      return true;
    }

    return false;
  }

  /* =======================================================
     MESSAGE ANALYZER
  ======================================================= */

  function analyzeMessage(text) {
    const flags = [];
    const lower = normalize(text);

    if (!text.trim()) {
      return flags;
    }

    const urgency = [
      "urgent",
      "immediately",
      "act now",
      "right now",
      "within 24 hours",
      "today only",
      "final warning",
      "last warning",
      "expires today",
      "respond immediately",
      "account will be closed"
    ];

    const impersonation = [
      "bank",
      "paypal",
      "microsoft",
      "apple",
      "amazon",
      "netflix",
      "police",
      "irs",
      "government",
      "customs",
      "immigration",
      "tax department",
      "security team",
      "support team"
    ];

    const credentials = [
      "password",
      "otp",
      "one time password",
      "one-time password",
      "verification code",
      "security code",
      "pin",
      "cvv",
      "card number",
      "bank details",
      "account number",
      "login details"
    ];

    const payments = [
      "send money",
      "transfer money",
      "wire transfer",
      "gift card",
      "bitcoin",
      "crypto",
      "cryptocurrency",
      "pay a fee",
      "registration fee",
      "processing fee",
      "payment required",
      "send payment"
    ];

    const threats = [
      "arrest",
      "warrant",
      "jail",
      "criminal charges",
      "account will be closed",
      "account suspended",
      "legal action",
      "deport",
      "lawsuit"
    ];

    const reward = [
      "you won",
      "winner",
      "congratulations",
      "free gift",
      "free money",
      "prize",
      "reward",
      "lottery"
    ];

    const remoteAccess = [
      "remote access",
      "remote desktop",
      "anydesk",
      "teamviewer",
      "screen sharing",
      "install this software"
    ];

    const urgencyMatch = containsPhrase(lower, urgency);
    const authorityMatch = containsPhrase(lower, impersonation);
    const credentialMatch = containsPhrase(lower, credentials);
    const paymentMatch = containsPhrase(lower, payments);
    const threatMatch = containsPhrase(lower, threats);
    const rewardMatch = containsPhrase(lower, reward);
    const remoteMatch = containsPhrase(lower, remoteAccess);

    const url = extractURL(text);

    /* Strong combination: impersonation + credential request */

    if (authorityMatch && credentialMatch) {
      flags.push(
        createFlag(
          "Impersonation with credential request",
          "High",
          "The message combines an organizational identity with a request for sensitive authentication information.",
          `${authorityMatch} + ${credentialMatch}`,
          "high"
        )
      );
    }

    /* Strong combination: impersonation + threat */

    if (authorityMatch && threatMatch) {
      flags.push(
        createFlag(
          "Authority impersonation with threat",
          "High",
          "The message uses an authority figure or organization together with threats or legal consequences.",
          `${authorityMatch} + ${threatMatch}`,
          "high"
        )
      );
    }

    /* Strong combination: payment + urgency */

    if (paymentMatch && urgencyMatch) {
      flags.push(
        createFlag(
          "Urgent payment request",
          "High",
          "The message combines a financial request with pressure to act quickly.",
          `${urgencyMatch} + ${paymentMatch}`,
          "high"
        )
      );
    }

    /* Credential request alone */

    if (credentialMatch) {
      flags.push(
        createFlag(
          "Sensitive information request",
          "Medium",
          "The message asks for credentials or financial information that should not normally be shared through an unsolicited message.",
          credentialMatch,
          "high"
        )
      );
    }

    /* Payment request alone */

    if (paymentMatch) {
      flags.push(
        createFlag(
          "Financial request",
          "Medium",
          "The message requests money, a fee, or a financial transaction.",
          paymentMatch,
          "moderate"
        )
      );
    }

    /* Suspicious urgency */

    if (urgencyMatch) {
      flags.push(
        createFlag(
          "Urgency or pressure",
          "Low",
          "The message attempts to shorten the time available for independent verification.",
          urgencyMatch,
          "moderate"
        )
      );
    }

    /* Threat alone */

    if (threatMatch && !authorityMatch) {
      flags.push(
        createFlag(
          "Threatening language",
          "Medium",
          "The message uses threats or serious consequences to pressure the recipient.",
          threatMatch,
          "moderate"
        )
      );
    }

    /* Reward + payment */

    if (rewardMatch && paymentMatch) {
      flags.push(
        createFlag(
          "Prize or reward payment pattern",
          "High",
          "The message combines a reward claim with a request for payment or fees.",
          `${rewardMatch} + ${paymentMatch}`,
          "high"
        )
      );
    }

    /* Remote access */

    if (remoteMatch) {
      flags.push(
        createFlag(
          "Remote-access request",
          "High",
          "The message asks the recipient to provide remote access or install remote-control software.",
          remoteMatch,
          "high"
        )
      );
    }

    /* URL */

    if (url) {
      const websiteFlags = analyzeWebsite(url);

      websiteFlags.forEach(flag => {
        if (
          flag.severity === "High" ||
          flag.severity === "Medium"
        ) {
          flags.push(
            createFlag(
              "Suspicious link in message",
              flag.severity,
              "The message contains a link with structural characteristics that deserve verification.",
              url,
              flag.confidence
            )
          );
        }
      });
    }

    return deduplicateFlags(flags);
  }

  /* =======================================================
     WEBSITE ANALYZER
  ======================================================= */

  function analyzeWebsite(text) {
    const flags = [];
    const url = parseURL(text);

    if (!url) {
      return [
        createFlag(
          "Invalid website address",
          "Low",
          "The input could not be parsed as a standard website URL.",
          String(text).slice(0, 80),
          "high"
        )
      ];
    }

    const host = url.hostname.toLowerCase();
    const path = url.pathname.toLowerCase();
    const full = url.href.toLowerCase();

    /* HTTP */

    if (url.protocol === "http:") {
      flags.push(
        createFlag(
          "Unencrypted HTTP connection",
          "Low",
          "The address uses HTTP instead of HTTPS. This alone does not mean the site is a scam, but HTTPS is preferable for sensitive transactions.",
          url.protocol,
          "high"
        )
      );
    }

    /* IP address */

    if (isIPv4(host)) {
      flags.push(
        createFlag(
          "IP-address website",
          "High",
          "The link uses a numeric IP address rather than a conventional domain name. This is unusual for legitimate consumer services and deserves verification.",
          host,
          "high"
        )
      );
    }

    /* Punycode */

    if (host.includes("xn--")) {
      flags.push(
        createFlag(
          "Punycode domain",
          "Medium",
          "The domain contains encoded international characters. This can be legitimate, but it can also be used for visually deceptive domains.",
          host,
          "high"
        )
      );
    }

    /* User information in URL */

    if (url.username || url.password) {
      flags.push(
        createFlag(
          "Embedded login information",
          "High",
          "The URL contains username/password information before the domain, a technique sometimes used in deceptive links.",
          host,
          "high"
        )
      );
    }

    /* Excessive subdomains */

    const subdomains =
      host.split(".").length - 2;

    if (subdomains >= 3) {
      flags.push(
        createFlag(
          "Deep subdomain structure",
          "Medium",
          "The domain contains several subdomain levels, which can make the actual registrable domain harder to notice.",
          host,
          "moderate"
        )
      );
    }

    /* Excessive hyphens */

    const hyphens =
      (host.match(/-/g) || []).length;

    if (hyphens >= 3) {
      flags.push(
        createFlag(
          "Unusually complex domain",
          "Medium",
          "The domain contains several hyphens and may be harder to verify at a glance.",
          host,
          "moderate"
        )
      );
    }

    /* Suspicious TLD */

    const tld = getTLD(host);

    if (SUSPICIOUS_TLDS.has(tld)) {
      flags.push(
        createFlag(
          "Frequently abused domain extension",
          "Medium",
          "This top-level domain has historically been used in disposable or phishing campaigns. The extension alone does not prove malicious intent.",
          "." + tld,
          "high"
        )
      );
    }

    /* Brand lookalikes */

    COMMON_BRANDS.forEach(brand => {

      if (looksLikeBrand(host, brand)) {

        flags.push(
          createFlag(
            "Possible brand impersonation",
            "High",
            `The domain appears to contain a variation of "${brand}" without being one of its known official domains.`,
            host,
            "moderate"
          )
        );
      }
    });

    /* Suspicious path */

    const sensitivePathWords = [
      "login",
      "signin",
      "verify",
      "verification",
      "secure",
      "account",
      "password",
      "payment",
      "billing",
      "claim",
      "reward"
    ];

    const pathMatch =
      containsPhrase(path, sensitivePathWords);

    if (pathMatch) {

      flags.push(
        createFlag(
          "Sensitive-action URL",
          "Low",
          "The URL leads to a login, verification, payment, account, or reward-related path. This is not inherently malicious, so the domain should be verified first.",
          pathMatch,
          "moderate"
        )
      );
    }

    /* Very long URL */

    if (full.length > 180) {
      flags.push(
        createFlag(
          "Unusually long URL",
          "Low",
          "The URL is unusually long and contains a large amount of additional path or query information.",
          full.slice(0, 100),
          "moderate"
        )
      );
    }

    /* @ in URL */

    if (url.href.includes("@")) {
      flags.push(
        createFlag(
          "Deceptive URL structure",
          "High",
          "An @ character appears in the URL and can be used to make a misleading address look like it belongs to a trusted domain.",
          url.href,
          "high"
        )
      );
    }

    return deduplicateFlags(flags);
  }

  /* =======================================================
     PHONE ANALYZER
  ======================================================= */

  function analyzePhone(text) {
    const flags = [];
    const raw = String(text || "").trim();

    /*
      Extract phone-looking sequences rather than deleting all
      non-digits from the entire message. This prevents dates,
      IDs, OTPs and unrelated numbers from becoming the phone.
    */

    const candidates =
      raw.match(
        /(?:\+?\d[\d\s().-]{6,}\d)/g
      ) || [];

    let phone = candidates[0] || "";

    /*
      If input is only a number, use the whole input.
    */

    if (!phone && /^[+\d\s().-]+$/.test(raw)) {
      phone = raw;
    }

    if (!phone) {
      flags.push(
        createFlag(
          "No phone number detected",
          "Low",
          "A recognizable phone number could not be extracted from the input.",
          raw.slice(0, 60),
          "high"
        )
      );

      return flags;
    }

    const digits = phone.replace(/\D/g, "");

    /* Basic length validation */

    if (digits.length < 7 || digits.length > 15) {
      flags.push(
        createFlag(
          "Unusual phone number length",
          "Low",
          "The detected number does not fit the usual international range of 7–15 digits.",
          phone,
          "high"
        )
      );
    }

    /*
      IMPORTANT:
      Do NOT label a number as suspicious merely because it has
      a particular country code.
    */

    const lower = normalize(raw);

    const callback = [
      "call back",
      "call me back",
      "return the call",
      "missed call",
      "one ring",
      "one-ring"
    ];

    const money = [
      "send money",
      "transfer money",
      "wire transfer",
      "gift card",
      "bitcoin",
      "crypto",
      "payment",
      "fee"
    ];

    const credentials = [
      "otp",
      "verification code",
      "password",
      "pin",
      "cvv",
      "card number",
      "bank details"
    ];

    const threats = [
      "arrest",
      "warrant",
      "jail",
      "criminal charges",
      "account suspended",
      "legal action",
      "deport"
    ];

    const authority = [
      "bank",
      "police",
      "government",
      "irs",
      "customs",
      "immigration",
      "microsoft",
      "apple",
      "amazon",
      "paypal"
    ];

    const callbackMatch =
      containsPhrase(lower, callback);

    const moneyMatch =
      containsPhrase(lower, money);

    const credentialMatch =
      containsPhrase(lower, credentials);

    const threatMatch =
      containsPhrase(lower, threats);

    const authorityMatch =
      containsPhrase(lower, authority);

    /* Strong scam combinations */

    if (authorityMatch && credentialMatch) {
      flags.push(
        createFlag(
          "Impersonation with sensitive-information request",
          "High",
          "The context combines a claimed organization with a request for sensitive information.",
          `${authorityMatch} + ${credentialMatch}`,
          "high"
        )
      );
    }

    if (authorityMatch && moneyMatch) {
      flags.push(
        createFlag(
          "Impersonation with financial request",
          "High",
          "The caller context combines an organization or authority claim with a request for money.",
          `${authorityMatch} + ${moneyMatch}`,
          "high"
        )
      );
    }

    if (authorityMatch && threatMatch) {
      flags.push(
        createFlag(
          "Threat-based impersonation",
          "High",
          "The context combines an authority claim with threats or legal consequences.",
          `${authorityMatch} + ${threatMatch}`,
          "high"
        )
      );
    }

    if (callbackMatch) {
      flags.push(
        createFlag(
          "Callback request",
          "Medium",
          "The context encourages the recipient to return an unexpected call. Verify the caller independently before calling back.",
          callbackMatch,
          "moderate"
        )
      );
    }

    /*
      Do not call an area code a scam.
      At most, provide neutral geographic information.
    */

    return deduplicateFlags(flags);
  }

  /* =======================================================
     EMAIL ANALYZER
  ======================================================= */

  function analyzeEmail(text) {
    const flags = [];
    const raw = String(text || "");

    const emailMatch = raw.match(
      /\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/i
    );

    if (!emailMatch) {
      flags.push(
        createFlag(
          "No valid email address detected",
          "Low",
          "The input does not contain a recognizable sender email address.",
          raw.slice(0, 80),
          "high"
        )
      );

      return flags;
    }

    const address = emailMatch[0];

    const atIndex = address.lastIndexOf("@");

    const local =
      address.slice(0, atIndex);

    const domain =
      address.slice(atIndex + 1).toLowerCase();

    const lower = normalize(raw);

    /* Domain format */

    if (
      domain.startsWith("-") ||
      domain.endsWith("-") ||
      domain.includes("..")
    ) {
      flags.push(
        createFlag(
          "Invalid or unusual sender domain structure",
          "Medium",
          "The sender domain has an unusual structure that should be verified.",
          domain,
          "high"
        )
      );
    }

    /* Free email pretending to be official */

    const officialWords = [
      "support",
      "security",
      "admin",
      "billing",
      "accounts",
      "helpdesk",
      "bank",
      "payroll",
      "hr",
      "service"
    ];

    const officialWord =
      containsPhrase(local, officialWords);

    if (
      officialWord &&
      FREE_EMAIL_DOMAINS.has(domain)
    ) {
      flags.push(
        createFlag(
          "Official-sounding sender using personal email",
          "Medium",
          `The address uses a free email provider while the sender name suggests an organizational department.`,
          address,
          "moderate"
        )
      );
    }

    /* Brand impersonation */

    COMMON_BRANDS.forEach(brand => {

      const official =
        OFFICIAL_DOMAINS[brand] || [];

      if (
        official.includes(domain)
      ) {
        return;
      }

      const compactDomain =
        domain.replace(/[^a-z0-9]/g, "");

      const compactBrand =
        brand.replace(/[^a-z0-9]/g, "");

      if (
        compactDomain.includes(compactBrand)
      ) {

        flags.push(
          createFlag(
            "Possible brand impersonation",
            "High",
            `The sender domain appears to imitate "${brand}" without matching one of its known official domains.`,
            domain,
            "moderate"
          )
        );
      }
    });

    /* Suspicious domain words */

    const suspiciousDomainWords = [
      "verify",
      "verification",
      "secure",
      "security",
      "account",
      "update",
      "confirm",
      "alert",
      "login"
    ];

    const suspiciousDomainWord =
      containsPhrase(domain, suspiciousDomainWords);

    const domainHyphens =
      (domain.match(/-/g) || []).length;

    if (
      suspiciousDomainWord &&
      domainHyphens >= 1
    ) {
      flags.push(
        createFlag(
          "Suspicious sender-domain wording",
          "Medium",
          "The sender domain combines security/account language with a constructed domain name.",
          domain,
          "moderate"
        )
      );
    }

    /* Email content */

    const urgency = containsPhrase(lower, [
      "urgent",
      "immediately",
      "act now",
      "within 24 hours",
      "final warning"
    ]);

    const credential = containsPhrase(lower, [
      "password",
      "otp",
      "verification code",
      "pin",
      "cvv",
      "login details"
    ]);

    const payment = containsPhrase(lower, [
      "payment",
      "wire transfer",
      "gift card",
      "bitcoin",
      "crypto",
      "invoice",
      "fee"
    ]);

    const attachment = containsPhrase(lower, [
      "open the attachment",
      "attached invoice",
      "attached document",
      "download the attachment"
    ]);

    const link = extractURL(raw);

    if (credential && urgency) {
      flags.push(
        createFlag(
          "Urgent credential request",
          "High",
          "The email combines pressure to act quickly with a request involving authentication information.",
          `${urgency} + ${credential}`,
          "high"
        )
      );
    }

    if (payment && urgency) {
      flags.push(
        createFlag(
          "Urgent financial request",
          "High",
          "The email combines financial activity with urgency.",
          `${urgency} + ${payment}`,
          "high"
        )
      );
    }

    if (attachment && urgency) {
      flags.push(
        createFlag(
          "Urgent attachment request",
          "Medium",
          "The email encourages opening an attachment under time pressure.",
          `${urgency} + ${attachment}`,
          "moderate"
        )
      );
    }

    if (link) {
      const websiteFlags =
        analyzeWebsite(link);

      if (
        websiteFlags.some(
          f => f.severity === "High"
        )
      ) {
        flags.push(
          createFlag(
            "Suspicious link in email",
            "High",
            "The email contains a link with significant structural warning signs.",
            link,
            "moderate"
          )
        );
      }
    }

    return deduplicateFlags(flags);
  }

  /* =======================================================
     SOCIAL PROFILE ANALYZER
  ======================================================= */

  function analyzeProfile(text) {
    const flags = [];
    const lower = normalize(text);

    /* Impersonation */

    const authority =
      containsPhrase(lower, [
        "official",
        "customer support",
        "support",
        "helpdesk",
        "admin",
        "verified",
        "recruiter",
        "hr",
        "security team"
      ]);

    if (authority) {
      flags.push(
        createFlag(
          "Authority or identity claim",
          "Low",
          "The profile uses language suggesting an official, verified, support, or professional identity. This is not proof of fraud and should be verified independently.",
          authority,
          "moderate"
        )
      );
    }

    /* Giveaway */

    const giveaway =
      containsPhrase(lower, [
        "giveaway",
        "free bitcoin",
        "send crypto",
        "double your crypto",
        "claim your prize",
        "airdrop",
        "free money"
      ]);

    if (giveaway) {
      flags.push(
        createFlag(
          "Giveaway or crypto promotion",
          "Medium",
          "The profile promotes a giveaway or crypto opportunity. Requests to send money first are a major warning sign.",
          giveaway,
          "moderate"
        )
      );
    }

    /* Payment */

    const payment =
      containsPhrase(lower, [
        "send money",
        "send crypto",
        "gift card",
        "wire money",
        "investment",
        "pay a fee",
        "registration fee"
      ]);

    if (payment && giveaway) {
      flags.push(
        createFlag(
          "Giveaway combined with financial request",
          "High",
          "The profile combines a reward or giveaway claim with a request for money or cryptocurrency.",
          `${giveaway} + ${payment}`,
          "high"
        )
      );
    }

    /* Romance scam */

    const romance =
      containsPhrase(lower, [
        "soulmate",
        "love you",
        "widow",
        "widower",
        "military",
        "deployed",
        "oil rig",
        "peacekeeping"
      ]);

    if (romance && payment) {
      flags.push(
        createFlag(
          "Possible relationship-based financial scam",
          "High",
          "The profile combines relationship-oriented claims with a financial request.",
          `${romance} + ${payment}`,
          "moderate"
        )
      );
    }

    /* New account */

    const newAccount =
      containsPhrase(lower, [
        "new account",
        "new profile",
        "created recently",
        "0 posts",
        "no posts",
        "few followers"
      ]);

    if (newAccount) {
      flags.push(
        createFlag(
          "Limited account history",
          "Low",
          "The profile appears to have limited history. New or low-activity accounts deserve additional verification but are not automatically fraudulent.",
          newAccount,
          "high"
        )
      );
    }

    /* Suspicious handle */

    const handle =
      lower.match(
        /@\w*(official|real|support|admin|hq)\w*/i
      );

    if (handle) {
      flags.push(
        createFlag(
          "Official-looking username",
          "Low",
          "The username uses an official-sounding term. This should be compared with the organization's verified account.",
          handle[0],
          "moderate"
        )
      );
    }

    return deduplicateFlags(flags);
  }

  /* =======================================================
     DEDUPLICATION
  ======================================================= */

  function deduplicateFlags(flags) {

    const map = new Map();

    flags.forEach(flag => {

      const key =
        flag.name.toLowerCase();

      if (!map.has(key)) {
        map.set(key, flag);
      }

    });

    return [...map.values()];
  }

  /* =======================================================
     SCORE ENGINE
     
     IMPORTANT:
     A score is an estimate of detected risk signals,
     NOT probability of fraud.
  ======================================================= */

  function calculateScore(flags) {

    if (!flags.length) {
      return 5;
    }

    let score = 0;

    flags.forEach(flag => {
      score += severityWeight(flag.severity);
    });

    /*
      Diminishing returns.
      Five weak signals shouldn't automatically become
      a near-certain scam.
    */

    if (flags.length > 3) {
      score -= (flags.length - 3) * 5;
    }

    score = Math.max(
      0,
      Math.min(95, score)
    );

    return Math.round(score);
  }

  function getVerdict(score) {

    if (score >= 60) {
      return "high";
    }

    if (score >= 30) {
      return "medium";
    }

    return "low";
  }

  /* =======================================================
     PUBLIC ANALYZE FUNCTION
  ======================================================= */

  function analyze(tab, text) {

    let flags = [];

    switch (tab) {

      case "message":
        flags = analyzeMessage(text);
        break;

      case "website":
        flags = analyzeWebsite(text);
        break;

      case "phone":
        flags = analyzePhone(text);
        break;

      case "email":
        flags = analyzeEmail(text);
        break;

      case "profile":
        flags = analyzeProfile(text);
        break;

      default:
        flags = [];
    }

    flags = deduplicateFlags(flags);

    const score =
      calculateScore(flags);

    const verdict =
      getVerdict(score);

    return {
      score,
      verdict,
      flags,
      tab
    };
  }

  return {
    analyze,
    analyzeMessage,
    analyzeWebsite,
    analyzePhone,
    analyzeEmail,
    analyzeProfile
  };

})();

/* =========================================================

========================================================= */

function renderProfessionalResult(

  originalText

    document.getElementById("resultScreen");

  const emptyResult =
    document.getElementById("emptyResult");

  const scanScreen =
    document.getElementById("scanScreen");

  if (!resultScreen) return;

  if (emptyResult) {
    emptyResult.style.display = "none";
  }

  if (scanScreen) {
    scanScreen.style.display = "none";
  }

  resultScreen.style.display = "block";

  const verdict =
    result.verdict;

  const title =
    resultTitles[result.tab][verdict];

  let summary;

  if (verdict === "high") {

    summary =
      "Multiple strong warning signals were detected. Treat this item as potentially unsafe until it is independently verified.";

  } else if (verdict === "medium") {

    summary =
      "Some warning signals were detected. The available evidence is not enough to prove fraud, so verify the sender, domain, or request before proceeding.";

  } else {

    summary =
      "No strong scam indicators were detected by the current rules. This does not prove that the item is legitimate.";

  }

  const flagHTML =
    result.flags.length
      ? result.flags.map(flag => `
          <div class="sl-result-flag">
            <div class="sl-flag-top">
              <strong>${escapeHTML(flag.name)}</strong>
              <span class="sl-severity ${flag.severity.toLowerCase()}">
                ${escapeHTML(flag.severity)}
              </span>
            </div>

            <p>
              ${escapeHTML(flag.description)}
            </p>

            ${
              flag.evidence
                ? `
                  <div class="sl-evidence">
                    Evidence:
                    <code>${escapeHTML(flag.evidence)}</code>
                  </div>
                `
                : ""
            }
          </div>
        `).join("")
      : `
        <div class="sl-no-flags">
          ✓ No strong warning patterns were detected.
        </div>
      `;

  const recommendationHTML =
    recommendations[result.tab]
      .map(item => `
        <li>${escapeHTML(item)}</li>
      `)
      .join("");

  resultScreen.innerHTML = `

    <div class="sl-professional-result">

      <div class="sl-result-header">

        <div>
          <div class="sl-result-eyebrow">
            SCAMLENS ASSESSMENT
          </div>

          <h2>
            ${escapeHTML(title)}
          </h2>
        </div>

          <span>${result.score}</span>
          <small>/100</small>
        </div>

      </div>

      <div class="sl-verdict-box ${verdict}">
        <strong>
          ${verdict === "high"
            ? "High risk"
            : verdict === "medium"
              ? "Medium risk"
              : "Low detected risk"}
        </strong>

        <p>
          ${escapeHTML(summary)}
        </p>
      </div>

      <div class="sl-result-section">

        <div class="sl-section-heading">
          Warning Signals
          <span>${result.flags.length}</span>
        </div>

        ${flagHTML}

      </div>

      <div class="sl-result-section">

        <div class="sl-section-heading">
          Recommended Actions
        </div>

        <ul class="sl-recommendations">
          ${recommendationHTML}
        </ul>

      </div>

      <div class="sl-result-section">

        <div class="sl-section-heading">
          Assessment Method
        </div>

        <p class="sl-method-text">
          This result was generated using category-specific structural
          and contextual rules. The score represents the strength of
          detected warning signals, not a probability that the item is
          fraudulent.
        </p>

      </div>

      <div class="sl-result-actions">

        <button
          type="button"
          onclick="copyScamLensReport()"
        >
          📋 Copy Report
        </button>

        <button
          type="button"
          onclick="downloadScamLensReport()"
        >
          ⬇ Download Report
        </button>

      </div>

      <div class="sl-result-disclaimer">
        ScamLens is a pattern-based screening tool.
        It cannot verify the identity of a sender, owner of a
        phone number, or website without external reputation data.
      </div>

    </div>
  `;

  window.lastScamLensResult =
    result;

  window.lastScamLensText =
    originalText;
}


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   COPY REPORT
========================================================= */

function copyScamLensReport() {

  const result =
    window.lastScamLensResult;

  const text =
    window.lastScamLensText;

  if (!result) return;

  const report =
    buildTextReport(
      result,
      text
    );

  navigator.clipboard
    .writeText(report)
    .then(() => {
      alert("ScamLens report copied.");
    })
    .catch(() => {
      alert("Unable to copy the report.");
    });
}


/* =========================================================
   DOWNLOAD REPORT
========================================================= */

function downloadScamLensReport() {

  const result =
    window.lastScamLensResult;

  const text =
    window.lastScamLensText;

  if (!result) return;

  const report =
    buildTextReport(
      result,
      text
    );

  const blob =
    new Blob(
      [report],
      { type: "text/plain;charset=utf-8" }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download =
    "scamlens-report.txt";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);
}


/* =========================================================
   TEXT REPORT
========================================================= */

function buildTextReport(
  result,
  originalText
) {

  const lines = [];

  lines.push("SCAMLENS REPORT");
  lines.push("================");
  lines.push("");

  lines.push(
    "Category: " +
    result.tab
  );

  lines.push(
    "Risk score: " +
    result.score +
    "/100"
  );

  lines.push(
    "Verdict: " +
    result.verdict.toUpperCase()
  );

  lines.push("");

  lines.push("WARNING SIGNALS");

  if (!result.flags.length) {

    lines.push(
      "No strong warning patterns detected."
    );

  } else {

    result.flags.forEach(flag => {

      lines.push(
        `[${flag.severity}] ${flag.name}`
      );

      lines.push(
        flag.description
      );

      if (flag.evidence) {

        lines.push(
          "Evidence: " +
          flag.evidence
        );
      }

      lines.push("");
    });
  }

  lines.push("");
  lines.push("ORIGINAL INPUT");
  lines.push(originalText);

  lines.push("");
  lines.push(
    "ScamLens provides pattern-based screening, not a definitive fraud verdict."
  );

  return lines.join("\n");
}
